<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="980" fill="url(#bg)"/>
  <circle cx="490" cy="490" r="410" fill="#dde5f2" opacity="0.6"/>
  <circle cx="490" cy="490" r="310" fill="none" stroke="#aab8d2" stroke-width="8" stroke-dasharray="4 26" stroke-linecap="round"/>

  <!-- central building -->
  <g>
    <ellipse cx="490" cy="656" rx="150" ry="20" fill="#c9d3e4"/>
    <rect x="414" y="340" width="152" height="316" rx="8" fill="#3259a8"/>
    <rect x="414" y="328" width="152" height="16" rx="6" fill="#24437e"/>
    <g fill="#dfe7f5">
      <rect x="436" y="368" width="32" height="40" rx="4"/>
      <rect x="478" y="368" width="32" height="40" rx="4"/>
      <rect x="520" y="368" width="32" height="40" rx="4"/>
      <rect x="436" y="430" width="32" height="40" rx="4"/>
      <rect x="478" y="430" width="32" height="40" rx="4"/>
      <rect x="520" y="430" width="32" height="40" rx="4"/>
      <rect x="436" y="492" width="32" height="40" rx="4"/>
      <rect x="478" y="492" width="32" height="40" rx="4"/>
      <rect x="520" y="492" width="32" height="40" rx="4"/>
    </g>
    <rect x="464" y="570" width="52" height="86" rx="4" fill="#24437e"/>
  </g>

  <!-- envelope chip: post -->
  <g transform="translate(270 270)">
    <circle r="92" fill="#ffffff"/>
    <circle r="92" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <rect x="-52" y="-34" width="104" height="70" rx="10" fill="#3259a8"/>
    <path d="M -46 -26 L 0 8 L 46 -26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- broom chip: cleaning -->
  <g transform="translate(710 270)">
    <circle r="92" fill="#ffffff"/>
    <circle r="92" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <g transform="rotate(24)">
      <rect x="-6" y="-58" width="12" height="70" rx="6" fill="#8a6f52"/>
      <path d="M -20 12 h40 l 12 44 h-64 z" fill="#f2a63b"/>
    </g>
  </g>

  <!-- security chip: camera -->
  <g transform="translate(270 710)">
    <circle r="92" fill="#ffffff"/>
    <circle r="92" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <rect x="-30" y="-52" width="14" height="34" fill="#8a94a6"/>
    <rect x="-52" y="-56" width="58" height="12" rx="6" fill="#8a94a6"/>
    <g transform="rotate(18)">
      <rect x="-42" y="-24" width="76" height="46" rx="10" fill="#3259a8"/>
      <path d="M 34 -14 L 58 -22 V 20 L 34 12 Z" fill="#3259a8"/>
      <circle cx="-20" cy="-2" r="9" fill="#ffffff"/>
    </g>
  </g>

  <!-- garden chip: leaf -->
  <g transform="translate(710 710)">
    <circle r="92" fill="#ffffff"/>
    <circle r="92" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <path d="M -32 40 C -48 -22 8 -56 48 -46 C 54 4 24 48 -20 42 Z" fill="#6fa87d"/>
    <path d="M -36 46 C -10 8 20 -18 44 -40" fill="none" stroke="#4c8a5c" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
