<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="670" fill="url(#bg)"/>
  <circle cx="490" cy="335" r="280" fill="#dde5f2"/>

  <!-- shelf -->
  <rect x="140" y="520" width="700" height="22" rx="10" fill="#aab2c2"/>

  <!-- toolbox -->
  <g transform="translate(490 430)">
    <rect x="-150" y="-40" width="300" height="130" rx="16" fill="#3259a8"/>
    <rect x="-150" y="-40" width="300" height="34" rx="16" fill="#24437e"/>
    <rect x="-46" y="-76" width="92" height="46" rx="18" fill="none" stroke="#24437e" stroke-width="16"/>
    <rect x="-16" y="-16" width="32" height="24" rx="6" fill="#f2a63b"/>
  </g>

  <!-- wrench -->
  <g transform="translate(230 330) rotate(-42)">
    <rect x="-18" y="-9" width="150" height="34" rx="17" fill="#8a94a6"/>
    <circle cx="-30" cy="8" r="40" fill="#8a94a6"/>
    <rect x="-64" y="-13" width="42" height="34" rx="8" fill="#dde5f2" transform="rotate(-14 -43 4)"/>
  </g>

  <!-- screwdriver -->
  <g transform="translate(730 300) rotate(38)">
    <rect x="-90" y="-16" width="110" height="32" rx="16" fill="#f2a63b"/>
    <rect x="20" y="-7" width="110" height="14" fill="#8a94a6"/>
    <path d="M 130 -7 l 26 7 -26 7 Z" fill="#8a94a6"/>
  </g>

  <!-- keys -->
  <g transform="translate(300 520)">
    <circle r="24" fill="none" stroke="#d88f24" stroke-width="11"/>
    <g transform="rotate(30)">
      <rect x="-5" y="18" width="10" height="60" rx="4" fill="#d88f24"/>
      <rect x="-5" y="58" width="22" height="9" fill="#d88f24"/>
      <rect x="-5" y="71" width="16" height="9" fill="#d88f24"/>
    </g>
    <g transform="rotate(-26)">
      <rect x="-5" y="18" width="10" height="54" rx="4" fill="#b3b9c3"/>
      <rect x="-5" y="52" width="20" height="8" fill="#b3b9c3"/>
      <rect x="-5" y="64" width="14" height="8" fill="#b3b9c3"/>
    </g>
  </g>

  <!-- lightbulb chip -->
  <g transform="translate(700 480)">
    <circle cx="0" cy="0" r="34" fill="#f8d489"/>
    <path d="M -14 26 h 28 v 14 a 8 8 0 0 1 -8 8 h -12 a 8 8 0 0 1 -8 -8 Z" fill="#8a94a6"/>
    <g stroke="#f2a63b" stroke-width="7" stroke-linecap="round">
      <line x1="-48" y1="-24" x2="-60" y2="-32"/>
      <line x1="48" y1="-24" x2="60" y2="-32"/>
      <line x1="0" y1="-48" x2="0" y2="-62"/>
    </g>
  </g>

  <!-- gear small -->
  <g transform="translate(180 180)">
    <g fill="#4d78c8">
      <rect x="-9" y="-52" width="18" height="18" rx="5"/>
      <rect x="-9" y="34" width="18" height="18" rx="5"/>
      <rect x="-52" y="-9" width="18" height="18" rx="5"/>
      <rect x="34" y="-9" width="18" height="18" rx="5"/>
      <g transform="rotate(45)">
        <rect x="-9" y="-52" width="18" height="18" rx="5"/>
        <rect x="-9" y="34" width="18" height="18" rx="5"/>
        <rect x="-52" y="-9" width="18" height="18" rx="5"/>
        <rect x="34" y="-9" width="18" height="18" rx="5"/>
      </g>
    </g>
    <circle r="40" fill="#4d78c8"/>
    <circle r="18" fill="#dde5f2"/>
  </g>
</svg>
