<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="980" fill="url(#bg)"/>
  <circle cx="490" cy="490" r="390" fill="#dde5f2"/>

  <!-- panel shadow + panel -->
  <rect x="156" y="216" width="700" height="580" rx="24" fill="#aab2c2" opacity="0.5"/>
  <rect x="140" y="200" width="700" height="580" rx="24" fill="#ffffff"/>
  <rect x="140" y="200" width="700" height="76" rx="24" fill="#3259a8"/>
  <rect x="140" y="252" width="700" height="24" fill="#3259a8"/>
  <circle cx="188" cy="238" r="11" fill="#ffffff" opacity="0.85"/>
  <circle cx="226" cy="238" r="11" fill="#ffffff" opacity="0.6"/>
  <circle cx="264" cy="238" r="11" fill="#ffffff" opacity="0.35"/>

  <!-- pie chart -->
  <g transform="translate(310 440)">
    <circle r="110" fill="#c9cfda"/>
    <path d="M 0 0 L 0 -110 A 110 110 0 0 1 95.3 55 Z" fill="#3259a8"/>
    <path d="M 0 0 L 95.3 55 A 110 110 0 0 1 -38 103.2 Z" fill="#f2a63b"/>
  </g>

  <!-- bars -->
  <g transform="translate(620 560)">
    <rect x="-90" y="-90" width="52" height="150" rx="8" fill="#c9cfda"/>
    <rect x="-20" y="-140" width="52" height="200" rx="8" fill="#4d78c8"/>
    <rect x="50" y="-200" width="52" height="260" rx="8" fill="#3259a8"/>
  </g>

  <!-- line chart -->
  <g transform="translate(0 0)">
    <polyline points="220,700 340,660 460,690 580,630 700,650 790,600" fill="none" stroke="#f2a63b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#f2a63b" stroke-width="8">
      <circle cx="340" cy="660" r="12"/>
      <circle cx="580" cy="630" r="12"/>
      <circle cx="790" cy="600" r="12"/>
    </g>
  </g>

  <!-- magnifier -->
  <g transform="translate(760 380)">
    <circle r="74" fill="#eef1f7" opacity="0.9"/>
    <circle r="74" fill="none" stroke="#24437e" stroke-width="18"/>
    <rect x="48" y="58" width="26" height="96" rx="13" fill="#24437e" transform="rotate(-45 48 58)"/>
  </g>
</svg>
