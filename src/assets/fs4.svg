<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="1140" fill="url(#bg)"/>
  <g transform="translate(490 460) rotate(-28)" opacity="0.5">
    <ellipse rx="420" ry="220" fill="#dde5f2"/>
  </g>

  <!-- wall frame with pie -->
  <g transform="translate(250 280)">
    <rect x="-130" y="-110" width="260" height="220" rx="16" fill="#ffffff"/>
    <rect x="-130" y="-110" width="260" height="220" rx="16" fill="none" stroke="#c9d3e4" stroke-width="8"/>
    <circle r="70" fill="#c9cfda"/>
    <path d="M 0 0 L 0 -70 A 70 70 0 0 1 60.6 35 Z" fill="#3259a8"/>
    <path d="M 0 0 L 60.6 35 A 70 70 0 0 1 -24 65.8 Z" fill="#f2a63b"/>
  </g>

  <!-- wall chart frame with bars -->
  <g transform="translate(700 260)">
    <rect x="-150" y="-100" width="300" height="200" rx="16" fill="#ffffff"/>
    <rect x="-150" y="-100" width="300" height="200" rx="16" fill="none" stroke="#c9d3e4" stroke-width="8"/>
    <rect x="-100" y="0" width="44" height="60" rx="6" fill="#c9cfda"/>
    <rect x="-30" y="-30" width="44" height="90" rx="6" fill="#4d78c8"/>
    <rect x="40" y="-60" width="44" height="120" rx="6" fill="#3259a8"/>
  </g>

  <!-- ground -->
  <rect y="960" width="980" height="180" fill="#dfe6f2"/>
  <rect y="952" width="980" height="10" rx="5" fill="#c9d3e4"/>

  <!-- person behind desk -->
  <g transform="translate(430 730)">
    <circle cx="0" cy="-140" r="46" fill="#c68863"/>
    <path d="M -46 -140 A 46 46 0 0 1 46 -140 Z" fill="#2a3140"/>
    <path d="M -110 40 C -110 -60 -50 -96 0 -96 C 50 -96 110 -60 110 40 Z" fill="#3259a8"/>
    <rect x="-140" y="-20" width="60" height="26" rx="13" fill="#3259a8" transform="rotate(30 -110 -7)"/>
    <rect x="80" y="-20" width="60" height="26" rx="13" fill="#3259a8" transform="rotate(-30 110 -7)"/>
  </g>

  <!-- desk -->
  <g>
    <rect x="180" y="770" width="620" height="34" rx="14" fill="#8a94a6"/>
    <rect x="220" y="804" width="30" height="156" fill="#aab2c2"/>
    <rect x="730" y="804" width="30" height="156" fill="#aab2c2"/>
    <!-- monitor -->
    <g transform="translate(620 700)">
      <rect x="-95" y="-70" width="190" height="130" rx="12" fill="#2a3140"/>
      <rect x="-83" y="-58" width="166" height="106" rx="6" fill="#eef1f7"/>
      <rect x="-62" y="4" width="26" height="34" rx="4" fill="#c9cfda"/>
      <rect x="-22" y="-16" width="26" height="54" rx="4" fill="#4d78c8"/>
      <rect x="18" y="-36" width="26" height="74" rx="4" fill="#3259a8"/>
      <rect x="-14" y="60" width="28" height="18" fill="#8a94a6"/>
      <rect x="-40" y="76" width="80" height="12" rx="6" fill="#8a94a6"/>
    </g>
    <!-- papers -->
    <g transform="translate(280 748) rotate(-4)">
      <rect x="-55" y="-16" width="110" height="20" rx="4" fill="#ffffff" stroke="#c9d3e4" stroke-width="3"/>
      <rect x="-50" y="-30" width="110" height="20" rx="4" fill="#ffffff" stroke="#c9d3e4" stroke-width="3"/>
    </g>
    <!-- calculator -->
    <g transform="translate(740 740)">
      <rect x="-38" y="-28" width="76" height="58" rx="8" fill="#24437e"/>
      <rect x="-28" y="-20" width="56" height="14" rx="3" fill="#bcd2f2"/>
      <g fill="#e7ebf4">
        <circle cx="-18" cy="8" r="5"/><circle cx="0" cy="8" r="5"/><circle cx="18" cy="8" r="5"/>
        <circle cx="-18" cy="22" r="5"/><circle cx="0" cy="22" r="5"/><circle cx="18" cy="22" r="5"/>
      </g>
    </g>
  </g>

  <!-- plant -->
  <g transform="translate(120 960)">
    <rect x="-34" y="-70" width="68" height="70" rx="8" fill="#24437e"/>
    <path d="M 0 -70 C -10 -130 -50 -140 -64 -128 C -58 -92 -30 -76 0 -70 Z" fill="#6fa87d"/>
    <path d="M 0 -70 C 10 -136 52 -146 66 -132 C 60 -94 30 -76 0 -70 Z" fill="#7fb28b"/>
    <rect x="-5" y="-124" width="10" height="54" rx="5" fill="#4c8a5c"/>
  </g>
</svg>
