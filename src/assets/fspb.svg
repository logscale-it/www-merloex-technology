<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 774">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
    <pattern id="w1" width="46" height="58" patternUnits="userSpaceOnUse" x="104" y="286">
      <rect x="10" y="12" width="24" height="32" rx="3" fill="#ffffff" opacity="0.9"/>
    </pattern>
    <pattern id="w2" width="50" height="62" patternUnits="userSpaceOnUse" x="298" y="196">
      <rect x="11" y="13" width="26" height="34" rx="3" fill="#dfe7f5" opacity="0.95"/>
    </pattern>
    <pattern id="w3" width="44" height="56" patternUnits="userSpaceOnUse" x="528" y="352">
      <rect x="10" y="12" width="22" height="30" rx="3" fill="#ffffff" opacity="0.95"/>
    </pattern>
  </defs>
  <rect width="728" height="774" fill="url(#sky)"/>

  <!-- swoosh motif -->
  <g transform="translate(364 330) rotate(-28)" opacity="0.5">
    <ellipse rx="330" ry="170" fill="#dde5f2"/>
    <path d="M -286 104 A 330 208 0 1 1 299 -88" fill="none" stroke="#c9d3e6" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- sun -->
  <circle cx="618" cy="120" r="46" fill="#f8d489"/>

  <!-- ground -->
  <rect y="640" width="728" height="134" fill="#dfe6f2"/>
  <rect y="632" width="728" height="10" rx="5" fill="#c9d3e4"/>

  <!-- buildings -->
  <g>
    <rect x="96" y="278" width="180" height="362" rx="8" fill="#4d78c8"/>
    <rect x="104" y="286" width="164" height="346" fill="url(#w1)"/>
    <rect x="96" y="266" width="180" height="18" rx="6" fill="#3a5fae"/>
  </g>
  <g>
    <rect x="290" y="186" width="212" height="454" rx="8" fill="#3259a8"/>
    <rect x="298" y="196" width="196" height="436" fill="url(#w2)"/>
    <rect x="290" y="172" width="212" height="20" rx="6" fill="#24437e"/>
    <rect x="352" y="128" width="14" height="46" fill="#24437e"/>
  </g>
  <g>
    <rect x="520" y="342" width="152" height="298" rx="8" fill="#c9cfda"/>
    <rect x="528" y="352" width="136" height="282" fill="url(#w3)"/>
    <rect x="520" y="330" width="152" height="16" rx="6" fill="#aab2c2"/>
  </g>

  <!-- entrance -->
  <rect x="358" y="560" width="76" height="80" rx="4" fill="#24437e"/>
  <rect x="368" y="572" width="56" height="68" rx="3" fill="#e7ebf4"/>

  <!-- trees -->
  <g>
    <rect x="52" y="576" width="14" height="66" rx="6" fill="#8a6f52"/>
    <circle cx="59" cy="546" r="44" fill="#6fa87d"/>
  </g>
  <g>
    <rect x="686" y="586" width="12" height="56" rx="5" fill="#8a6f52"/>
    <circle cx="692" cy="560" r="36" fill="#7fb28b"/>
  </g>
  <g>
    <rect x="486" y="596" width="10" height="46" rx="4" fill="#8a6f52"/>
    <circle cx="491" cy="576" r="28" fill="#6fa87d"/>
  </g>

  <!-- hedge -->
  <rect x="120" y="612" width="150" height="30" rx="15" fill="#7fb28b"/>
</svg>
