<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="768" height="768" fill="url(#bg)"/>
  <circle cx="384" cy="384" r="300" fill="#dde5f2"/>

  <!-- rooftop slab -->
  <rect x="120" y="560" width="528" height="26" rx="10" fill="#aab2c2"/>

  <!-- HVAC unit -->
  <g>
    <rect x="196" y="380" width="240" height="180" rx="14" fill="#c9cfda"/>
    <rect x="196" y="380" width="240" height="34" rx="14" fill="#8a94a6"/>
    <circle cx="286" cy="486" r="52" fill="#eef1f7"/>
    <circle cx="286" cy="486" r="44" fill="#8a94a6"/>
    <g fill="#eef1f7">
      <path d="M286 452 a34 34 0 0 1 30 18 l-30 16 z"/>
      <path d="M316 504 a34 34 0 0 1 -34 14 l4 -34 z"/>
      <path d="M256 500 a34 34 0 0 1 4 -46 l26 32 z"/>
    </g>
    <circle cx="286" cy="486" r="8" fill="#2a3140"/>
    <rect x="360" y="430" width="52" height="10" rx="5" fill="#8a94a6"/>
    <rect x="360" y="452" width="52" height="10" rx="5" fill="#8a94a6"/>
    <rect x="360" y="474" width="52" height="10" rx="5" fill="#8a94a6"/>
  </g>

  <!-- gauge -->
  <g transform="translate(520 250)">
    <circle r="86" fill="#ffffff"/>
    <circle r="86" fill="none" stroke="#3259a8" stroke-width="12"/>
    <g stroke="#8a94a6" stroke-width="6" stroke-linecap="round">
      <line x1="-52" y1="-30" x2="-62" y2="-36"/>
      <line x1="0" y1="-60" x2="0" y2="-72"/>
      <line x1="52" y1="-30" x2="62" y2="-36"/>
    </g>
    <line x1="0" y1="0" x2="34" y2="-42" stroke="#f2a63b" stroke-width="10" stroke-linecap="round"/>
    <circle r="12" fill="#2a3140"/>
  </g>

  <!-- wrench -->
  <g transform="translate(470 520) rotate(-40)">
    <rect x="-24" y="-10" width="190" height="42" rx="21" fill="#3259a8"/>
    <circle cx="-40" cy="11" r="52" fill="#3259a8"/>
    <rect x="-84" y="-16" width="52" height="42" rx="10" fill="#dde5f2" transform="rotate(-14 -58 5)"/>
  </g>

  <!-- gear -->
  <g transform="translate(220 240)">
    <g fill="#4d78c8">
      <rect x="-12" y="-74" width="24" height="24" rx="6"/>
      <rect x="-12" y="50" width="24" height="24" rx="6"/>
      <rect x="-74" y="-12" width="24" height="24" rx="6"/>
      <rect x="50" y="-12" width="24" height="24" rx="6"/>
      <g transform="rotate(45)">
        <rect x="-12" y="-74" width="24" height="24" rx="6"/>
        <rect x="-12" y="50" width="24" height="24" rx="6"/>
        <rect x="-74" y="-12" width="24" height="24" rx="6"/>
        <rect x="50" y="-12" width="24" height="24" rx="6"/>
      </g>
    </g>
    <circle r="58" fill="#4d78c8"/>
    <circle r="26" fill="#dde5f2"/>
  </g>
</svg>
