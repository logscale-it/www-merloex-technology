<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1288">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="1288" fill="url(#bg)"/>
  <circle cx="490" cy="640" r="430" fill="#dde5f2" opacity="0.6"/>

  <!-- lifecycle arcs -->
  <g fill="none" stroke="#3259a8" stroke-width="16" stroke-linecap="round">
    <path d="M 723 873 A 330 330 0 0 1 257 873"/>
    <path d="M 171 725 A 330 330 0 0 1 405 321"/>
    <path d="M 575 321 A 330 330 0 0 1 809 725"/>
  </g>
  <g fill="#3259a8">
    <path d="M 0 -24 L 38 0 L 0 24 Z" transform="translate(257 873) rotate(225)"/>
    <path d="M 0 -24 L 38 0 L 0 24 Z" transform="translate(405 321) rotate(-15)"/>
    <path d="M 0 -24 L 38 0 L 0 24 Z" transform="translate(809 725) rotate(105)"/>
  </g>

  <!-- building center -->
  <g>
    <ellipse cx="490" cy="856" rx="190" ry="26" fill="#c9d3e4"/>
    <rect x="400" y="440" width="180" height="416" rx="8" fill="#3259a8"/>
    <rect x="400" y="426" width="180" height="18" rx="6" fill="#24437e"/>
    <g fill="#dfe7f5">
      <rect x="424" y="470" width="36" height="46" rx="4"/>
      <rect x="472" y="470" width="36" height="46" rx="4"/>
      <rect x="520" y="470" width="36" height="46" rx="4"/>
      <rect x="424" y="540" width="36" height="46" rx="4"/>
      <rect x="472" y="540" width="36" height="46" rx="4"/>
      <rect x="520" y="540" width="36" height="46" rx="4"/>
      <rect x="424" y="610" width="36" height="46" rx="4"/>
      <rect x="472" y="610" width="36" height="46" rx="4"/>
      <rect x="520" y="610" width="36" height="46" rx="4"/>
      <rect x="424" y="680" width="36" height="46" rx="4"/>
      <rect x="520" y="680" width="36" height="46" rx="4"/>
    </g>
    <rect x="462" y="760" width="56" height="96" rx="4" fill="#24437e"/>
  </g>

  <!-- coins chip (Werterhaltung) -->
  <g transform="translate(490 310)">
    <circle r="86" fill="#ffffff"/>
    <circle r="86" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <ellipse cx="0" cy="18" rx="44" ry="14" fill="#d88f24"/>
    <ellipse cx="0" cy="2" rx="44" ry="14" fill="#f2a63b"/>
    <ellipse cx="0" cy="-14" rx="44" ry="14" fill="#d88f24"/>
    <ellipse cx="0" cy="-18" rx="32" ry="9" fill="#f8c877"/>
  </g>

  <!-- leaf chip (Nachhaltigkeit) -->
  <g transform="translate(776 805)">
    <circle r="86" fill="#ffffff"/>
    <circle r="86" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <path d="M -30 38 C -44 -20 8 -52 44 -44 C 50 4 22 44 -18 40 Z" fill="#6fa87d"/>
    <path d="M -34 44 C -10 8 18 -16 40 -38" fill="none" stroke="#4c8a5c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- shield chip (Sicherheit) -->
  <g transform="translate(204 805)">
    <circle r="86" fill="#ffffff"/>
    <circle r="86" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <path d="M 0 -48 L 40 -32 V 4 C 40 26 22 40 0 50 C -22 40 -40 26 -40 4 V -32 Z" fill="#3259a8"/>
