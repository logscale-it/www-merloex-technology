<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="1140" fill="url(#bg)"/>
  <g transform="translate(490 480) rotate(-28)" opacity="0.5">
    <ellipse rx="420" ry="220" fill="#dde5f2"/>
  </g>

  <!-- ground -->
  <rect y="960" width="980" height="180" fill="#dfe6f2"/>
  <rect y="952" width="980" height="10" rx="5" fill="#c9d3e4"/>

  <!-- boiler tank -->
  <g>
    <rect x="570" y="300" width="250" height="660" rx="40" fill="#c9cfda"/>
    <rect x="570" y="420" width="250" height="26" fill="#aab2c2"/>
    <rect x="570" y="800" width="250" height="26" fill="#aab2c2"/>
    <!-- gauge on tank -->
    <circle cx="695" cy="560" r="64" fill="#ffffff"/>
    <circle cx="695" cy="560" r="64" fill="none" stroke="#3259a8" stroke-width="10"/>
    <line x1="695" y1="560" x2="722" y2="528" stroke="#f2a63b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="695" cy="560" r="9" fill="#2a3140"/>
    <!-- hatch -->
    <rect x="655" y="680" width="80" height="90" rx="12" fill="#8a94a6"/>
  </g>

  <!-- pipes -->
  <g fill="#8a94a6">
    <rect x="120" y="120" width="640" height="34"/>
    <rect x="726" y="120" width="34" height="180"/>
    <rect x="120" y="120" width="34" height="240"/>
    <circle cx="137" cy="137" r="17"/>
    <circle cx="743" cy="137" r="17"/>
  </g>
  <!-- valve wheel -->
  <g transform="translate(137 400)">
    <rect x="-17" y="-46" width="34" height="60" fill="#8a94a6"/>
    <circle r="46" fill="none" stroke="#3259a8" stroke-width="14"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#3259a8" stroke-width="10"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#3259a8" stroke-width="10"/>
    <circle r="12" fill="#3259a8"/>
  </g>

  <!-- technician -->
  <g transform="translate(340 1090)">
    <rect x="-38" y="-180" width="32" height="180" rx="8" fill="#2a3140"/>
    <rect x="6" y="-180" width="32" height="180" rx="8" fill="#2a3140"/>
    <rect x="-46" y="-16" width="46" height="16" rx="8" fill="#24437e"/>
    <rect x="0" y="-16" width="46" height="16" rx="8" fill="#24437e"/>
    <rect x="-72" y="-424" width="144" height="260" rx="44" fill="#3259a8"/>
    <rect x="-56" y="-416" width="44" height="170" rx="15" fill="#f2a63b"/>
    <rect x="12" y="-416" width="44" height="170" rx="15" fill="#f2a63b"/>
    <rect x="-56" y="-350" width="44" height="13" fill="#e2e6ee"/>
    <rect x="12" y="-350" width="44" height="13" fill="#e2e6ee"/>
    <rect x="-102" y="-414" width="30" height="190" rx="15" fill="#3259a8"/>
    <rect x="72" y="-414" width="30" height="190" rx="15" fill="#3259a8"/>
    <circle cx="-87" cy="-212" r="16" fill="#c68863"/>
    <circle cx="87" cy="-212" r="16" fill="#c68863"/>
    <circle cx="0" cy="-474" r="48" fill="#c68863"/>
    <path d="M -48 -478 A 48 42 0 0 1 48 -478 L 48 -470 L -48 -470 Z" fill="#f2a63b"/>
    <rect x="-60" y="-474" width="120" height="11" rx="5" fill="#d88f24"/>
    <!-- wrench in hand -->
    <g transform="translate(104 -196) rotate(-52)">
      <rect x="-14" y="-7" width="110" height="26" rx="13" fill="#8a94a6"/>
      <circle cx="-24" cy="6" r="30" fill="#8a94a6"/>
      <rect x="-50" y="-10" width="32" height="26" rx="6" fill="#dfe6f2" transform="rotate(-14 -34 3)"/>
    </g>
  </g>
</svg>
