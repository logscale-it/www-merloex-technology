<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="768" height="768" fill="url(#bg)"/>
  <circle cx="384" cy="384" r="300" fill="#dde5f2"/>

  <!-- building silhouette -->
  <g opacity="0.55">
    <rect x="420" y="180" width="180" height="290" rx="8" fill="#aab8d2"/>
    <g fill="#e7ebf4">
      <rect x="444" y="208" width="34" height="42" rx="4"/>
      <rect x="494" y="208" width="34" height="42" rx="4"/>
      <rect x="544" y="208" width="34" height="42" rx="4"/>
      <rect x="444" y="272" width="34" height="42" rx="4"/>
      <rect x="494" y="272" width="34" height="42" rx="4"/>
      <rect x="544" y="272" width="34" height="42" rx="4"/>
      <rect x="444" y="336" width="34" height="42" rx="4"/>
      <rect x="494" y="336" width="34" height="42" rx="4"/>
      <rect x="544" y="336" width="34" height="42" rx="4"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="120" y="560" width="528" height="26" rx="10" fill="#aab2c2"/>

  <!-- broom -->
