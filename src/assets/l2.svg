    </g>
  </g>

  <!-- bucket -->
  <g transform="translate(470 500)">
    <path d="M -74 -40 L 74 -40 L 58 88 L -58 88 Z" fill="#3259a8"/>
    <ellipse cx="0" cy="-40" rx="74" ry="16" fill="#4d78c8"/>
    <path d="M -58 -44 A 58 46 0 0 1 58 -44" fill="none" stroke="#8a94a6" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="0" cy="-42" rx="52" ry="10" fill="#bcd2f2"/>
  </g>

  <!-- sparkles -->
  <g fill="#4d78c8">
    <path d="M 196 200 l 7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7 z"/>
    <path d="M 560 520 l 6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z"/>
    <path d="M 150 470 l 5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5 z"/>
