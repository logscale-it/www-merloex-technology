<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="670" fill="url(#bg)"/>

  <!-- ground -->
  <rect y="560" width="980" height="110" fill="#dfe6f2"/>
  <rect y="552" width="980" height="8" rx="4" fill="#c9d3e4"/>

  <!-- crane -->
  <g stroke="#f2a63b" stroke-width="14" fill="none" stroke-linecap="round">
    <line x1="200" y1="560" x2="200" y2="120"/>
    <line x1="248" y1="560" x2="248" y2="120"/>
    <line x1="200" y1="200" x2="248" y2="160"/>
    <line x1="200" y1="280" x2="248" y2="240"/>
    <line x1="200" y1="360" x2="248" y2="320"/>
    <line x1="200" y1="440" x2="248" y2="400"/>
    <line x1="200" y1="520" x2="248" y2="480"/>
    <line x1="100" y1="120" x2="560" y2="120"/>
  </g>
  <rect x="100" y="106" width="70" height="42" fill="#8a94a6"/>
  <rect x="186" y="86" width="76" height="46" rx="8" fill="#3259a8"/>
  <line x1="360" y1="120" x2="360" y2="230" stroke="#8a94a6" stroke-width="8"/>
  <path d="M 344 230 h 32 l -6 26 h -20 Z" fill="#8a94a6"/>

  <!-- building under construction -->
  <g transform="translate(600 200)">
