      <line x1="0" y1="180" x2="280" y2="180"/>
      <line x1="0" y1="270" x2="280" y2="270"/>
      <line x1="93" y1="0" x2="93" y2="360"/>
      <line x1="187" y1="0" x2="187" y2="360"/>
    </g>
    <rect x="-14" y="-16" width="308" height="20" rx="8" fill="#8a94a6"/>
  </g>

  <!-- site manager -->
  <g transform="translate(460 640) scale(0.82)">
    <rect x="-36" y="-176" width="31" height="176" rx="8" fill="#2a3140"/>
    <rect x="6" y="-176" width="31" height="176" rx="8" fill="#2a3140"/>
    <rect x="-44" y="-15" width="45" height="15" rx="7" fill="#24437e"/>
    <rect x="0" y="-15" width="45" height="15" rx="7" fill="#24437e"/>
    <rect x="-70" y="-418" width="140" height="252" rx="44" fill="#3259a8"/>
    <rect x="-54" y="-410" width="43" height="168" rx="15" fill="#f2a63b"/>
    <rect x="12" y="-410" width="43" height="168" rx="15" fill="#f2a63b"/>
    <rect x="-54" y="-346" width="43" height="12" fill="#e2e6ee"/>
    <rect x="12" y="-346" width="43" height="12" fill="#e2e6ee"/>
    <rect x="-99" y="-408" width="29" height="186" rx="14" fill="#3259a8"/>
    <circle cx="-85" cy="-212" r="15" fill="#e9b48c"/>
    <!-- rolled plans held in front -->
    <rect x="66" y="-406" width="29" height="150" rx="14" fill="#3259a8"/>
    <circle cx="81" cy="-248" r="15" fill="#e9b48c"/>
    <rect x="-20" y="-268" width="180" height="42" rx="21" fill="#ffffff" stroke="#aab2c2" stroke-width="5" transform="rotate(-10 70 -247)"/>
    <ellipse cx="156" cy="-278" rx="10" ry="21" fill="#dfe6f2" transform="rotate(-10 156 -278)"/>
    <circle cx="0" cy="-464" r="46" fill="#e9b48c"/>
