<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="1140" fill="url(#bg)"/>
  <g transform="translate(490 460) rotate(-28)" opacity="0.5">
    <ellipse rx="420" ry="220" fill="#dde5f2"/>
  </g>

  <!-- ground -->
  <rect y="960" width="980" height="180" fill="#dfe6f2"/>
  <rect y="952" width="980" height="10" rx="5" fill="#c9d3e4"/>

  <!-- open door -->
  <g transform="translate(300 960)">
    <rect x="-140" y="-560" width="280" height="560" rx="10" fill="#24437e"/>
    <rect x="-116" y="-536" width="232" height="536" fill="#bcd2f2"/>
    <!-- door swung open -->
    <path d="M -116 -536 L -240 -580 L -240 20 L -116 0 Z" fill="#3259a8"/>
    <circle cx="-212" cy="-270" r="12" fill="#f2a63b"/>
    <!-- welcome mat -->
    <rect x="-90" y="10" width="180" height="34" rx="10" fill="#f2a63b"/>
  </g>

  <!-- arrow up -->
  <g transform="translate(690 330)">
    <path d="M -120 130 Q -20 60 60 -50" fill="none" stroke="#3259a8" stroke-width="22" stroke-linecap="round"/>
    <path d="M 60 -50 l -64 6 M 60 -50 l -14 60" stroke="#3259a8" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- plus chip -->
  <g transform="translate(180 250)">
    <circle r="70" fill="#ffffff"/>
    <circle r="70" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <rect x="-34" y="-9" width="68" height="18" rx="9" fill="#6fa87d"/>
    <rect x="-9" y="-34" width="18" height="68" rx="9" fill="#6fa87d"/>
  </g>

  <!-- waving new colleague -->
  <g transform="translate(650 1090)">
    <rect x="-36" y="-178" width="31" height="178" rx="8" fill="#2a3140"/>
    <rect x="6" y="-178" width="31" height="178" rx="8" fill="#2a3140"/>
    <rect x="-44" y="-15" width="45" height="15" rx="7" fill="#24437e"/>
    <rect x="0" y="-15" width="45" height="15" rx="7" fill="#24437e"/>
    <rect x="-70" y="-420" width="140" height="252" rx="44" fill="#3259a8"/>
    <rect x="-54" y="-412" width="43" height="168" rx="15" fill="#f2a63b"/>
    <rect x="12" y="-412" width="43" height="168" rx="15" fill="#f2a63b"/>
    <rect x="-54" y="-348" width="43" height="12" fill="#e2e6ee"/>
    <rect x="12" y="-348" width="43" height="12" fill="#e2e6ee"/>
    <!-- left arm down -->
    <rect x="-99" y="-410" width="29" height="186" rx="14" fill="#3259a8"/>
    <circle cx="-85" cy="-214" r="15" fill="#c68863"/>
    <!-- right arm raised waving -->
    <rect x="66" y="-560" width="29" height="180" rx="14" fill="#3259a8" transform="rotate(24 80 -390)"/>
    <circle cx="152" cy="-540" r="17" fill="#c68863"/>
    <circle cx="0" cy="-466" r="46" fill="#c68863"/>
    <path d="M -46 -470 A 46 40 0 0 1 46 -470 L 46 -462 L -46 -462 Z" fill="#f2a63b"/>
    <rect x="-58" y="-466" width="116" height="11" rx="5" fill="#d88f24"/>
  </g>
</svg>
