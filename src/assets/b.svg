<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1016">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#e7ebf4"/>
    </linearGradient>
  </defs>
  <rect width="980" height="1016" fill="url(#bg)"/>
  <circle cx="490" cy="520" r="400" fill="#dde5f2"/>

  <!-- speech bubble -->
  <g transform="translate(650 250)">
    <rect x="-190" y="-110" width="380" height="220" rx="40" fill="#3259a8"/>
    <path d="M -60 104 L -20 104 L -70 175 Z" fill="#3259a8"/>
    <circle cx="-80" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff" opacity="0.75"/>
    <circle cx="80" cy="0" r="22" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- envelope chip -->
  <g transform="translate(190 300)">
    <circle r="86" fill="#ffffff"/>
    <circle r="86" fill="none" stroke="#c9d3e4" stroke-width="6"/>
    <rect x="-48" y="-32" width="96" height="66" rx="10" fill="#f2a63b"/>
    <path d="M -42 -24 L 0 8 L 42 -24" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- support person with headset -->
  <g transform="translate(450 1016)">
    <path d="M -230 0 C -230 -180 -110 -270 0 -270 C 110 -270 230 -180 230 0 Z" fill="#3259a8"/>
    <rect x="-64" y="-330" width="128" height="90" rx="30" fill="#e9b48c"/>
    <circle cx="0" cy="-390" r="96" fill="#e9b48c"/>
    <path d="M -96 -390 A 96 96 0 0 1 96 -390 Z" fill="#6b4a2f"/>
    <path d="M -104 -400 A 104 100 0 0 1 104 -400" fill="none" stroke="#2a3140" stroke-width="20" stroke-linecap="round"/>
    <rect x="-124" y="-412" width="34" height="66" rx="16" fill="#2a3140"/>
    <rect x="90" y="-412" width="34" height="66" rx="16" fill="#2a3140"/>
    <path d="M 110 -360 C 110 -310 70 -300 34 -304" fill="none" stroke="#2a3140" stroke-width="14" stroke-linecap="round"/>
    <circle cx="26" cy="-304" r="14" fill="#2a3140"/>
    <path d="M -110 -60 C -60 -110 60 -110 110 -60" fill="none" stroke="#24437e" stroke-width="0"/>
    <rect x="-230" y="-24" width="460" height="24" fill="#24437e"/>
  </g>
</svg>
